# Declarative reference for a FRESH finops-dashboard-mcp-app service. Prefer ./deploy/deploy_cloud_run.sh or deploy/cloudbuild.yaml.
#
# WARNING: `gcloud run services replace` swaps in this whole spec. Settings that are not in this file are
# removed from the live service, for example custom audiences (run.googleapis.com/custom-audiences) and
# env vars added later. To change an existing service declaratively, export the live spec, edit it, and
# replace with that instead:
#   gcloud run services describe finops-dashboard-mcp-app --region=us-central1 --format=export > live_service.yaml
#
# Placeholders: __PROJECT_ID__, __PROJECT_NUMBER__, __REGION__, __IMAGE_URI__. The image must be an
# immutable tag or digest (for example .../finops-dashboard-mcp-app:<BUILD_ID> from cloudbuild.yaml), never :latest.
# Example:
#   sed -e 's|__PROJECT_ID__|my-project|g; s|__PROJECT_NUMBER__|123456789|g; s|__REGION__|us-central1|g' \
#       -e 's|__IMAGE_URI__|us-central1-docker.pkg.dev/my-project/cloud-run-source-deploy/finops-dashboard-mcp-app:BUILD_ID|' \
#       deploy/cloud_run_service.yaml > /tmp/service.yaml
#   gcloud run services replace /tmp/service.yaml --region=us-central1
# replace does not change IAM, so the service stays private. Grant roles/run.invoker as deploy_cloud_run.sh does.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finops-dashboard-mcp-app
  labels:
    cloud.googleapis.com/location: __REGION__
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: finops-dashboard-runtime-sa@__PROJECT_ID__.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: __IMAGE_URI__
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: __PROJECT_ID__
            - name: GOOGLE_CLOUD_REGION
              value: __REGION__
            - name: GOOGLE_CLOUD_LOCATION
              value: global
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: 'TRUE'
            - name: USE_UVICORN
              value: '1'
            - name: ENABLE_MCP_APP
              value: '1'
            - name: MCP_PROTOCOL_VERSION
              value: '2025-06-18'
            - name: FINOPS_PUBLIC_URL
              value: https://finops-dashboard-mcp-app-__PROJECT_NUMBER__.__REGION__.run.app
          ports:
            - name: http1
              containerPort: 8080
          # /healthz is FinOps Dashboard's own route, so it stays up even if the ADK API server fails to load.
          # Cloud Run's internal probes can reach it; on the public URL it is reserved (use /health).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3

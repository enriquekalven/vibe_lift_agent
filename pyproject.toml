[project]
name = "finops-dashboard-mcp-app"
version = "1.0.0"
description = "FinOps Dashboard — Google Cloud Agent Runtime, Telemetry Dashboard & AlphaEvolve Studio"
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (exact pins verified in the production image; see constraints.txt).
dependencies = [
    "google-adk==2.10.0",
    "google-genai==2.25.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "google-cloud-logging==3.16.3",
    "google-cloud-monitoring==2.31.0",
    "google-cloud-bigquery==3.45.2",
    "python-dotenv==1.2.3",
    "absl-py==2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finops_dashboard", "app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "codespell>=2.2.0",
    "mypy>=1.11.0",
]

[tool.agents-cli]
name = "finops_dashboard_mcp_app"
agent_directory = "app"
deployment_target = "cloud_run"
region = "us-central1"

[tool.ruff]
target-version = "py311"
line-length = 120
# recipes/ is linted with google/adk-recipes' own ruff config, which differs from this one.
extend-exclude = ["recipes"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (UI template & SQL literals)
    "B008",   # FastAPI Body(...) / Query(...) dependency defaults in argument lists
    "RUF001", # typographic unicode in UI/report strings (en-dash, multiplication sign)
    "RUF002", # typographic unicode in docstrings
    "RUF003", # typographic unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"app/agent.py" = ["E402"]
"app/fast_api_app.py" = ["E402"]
"finops_dashboard/server.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app", "finops_dashboard"]

[tool.codespell]
skip = ".git,__pycache__,.ruff_cache,.mypy_cache,.pytest_cache,.adk,.google-agents-cli,artifacts"
ignore-words-list = "nd,ot,te,ket,hist,ser,ba,sme,ue,emailin,prevend"


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
exclude = ["^\\.venv", "^tests/"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]



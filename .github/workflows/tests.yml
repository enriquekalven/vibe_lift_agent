name: CI — Lint, Typecheck, Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Ruff Lint, Codespell & Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml

      - name: Install dependencies & quality tools
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install "ruff>=0.5.0" "codespell>=2.2.0" "mypy>=1.11.0"

      - name: Bytecode & syntax check
        run: python -m compileall -q app vibelift tests deploy/bigquery

      - name: Ruff linter
        run: ruff check .

      - name: Codespell check
        run: codespell

      - name: Mypy static type check
        run: mypy app vibelift deploy/bigquery

      - name: Secret & credential hygiene check
        run: |
          if git grep -nE '(PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}|ya29\.[0-9A-Za-z_-]+)' -- ':!tests/*' ; then
            echo "ERROR: Potential secret or credential literal detected in repository!"
            exit 1
          fi

  unittest-and-coverage:
    name: Unit & Integration Tests (>=90% Coverage) + Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install pinned dependencies & coverage
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install "coverage[toml]>=7.5.0" "pytest>=8.0.0" "httpx>=0.27.0"

      # Offline: the credentials path does not exist, so no live Google Cloud API is called.
      - name: Run test suite with coverage gate (>=90%)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/offline-test-credentials.json
          GOOGLE_CLOUD_PROJECT: test-project
        run: |
          coverage run --source=vibelift,app -m unittest discover -s tests -t . -v
          coverage report --fail-under=90 -m

      - name: Live HTTP + MCP JSON-RPC + Date-Range smoke check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/offline-test-credentials.json
          GOOGLE_CLOUD_PROJECT: test-project
        run: |
          python - <<'PY'
          import vibelift.server as srv
          from vibelift.mcp_server import handle_mcp_jsonrpc

          for hrs in (1, 6, 24, 168, 720, 2160, 4320, 8760):
              state = srv.get_state_payload(window_hours=hrs)
              assert state["ge_fleet"]["window_hours"] == hrs, f"Expected {hrs}, got {state['ge_fleet']['window_hours']}"

          rpc = handle_mcp_jsonrpc(
              {"jsonrpc": "2.0", "id": 1, "method": "tools/call",
               "params": {"name": "query_ge_agent_fleet", "arguments": {"window_hours": 8760}}},
              srv.STATE,
          )
          assert not rpc["result"].get("isError"), rpc
          print("Smoke check passed for all 8 date ranges (1h, 6h, 24h, 7d, 1m, 3m, 6m, 1y) and MCP JSON-RPC!")
          PY

name: FinOps AST Linter & Prompt Cache X-Ray Gate

on:
  pull_request:
    paths:
      - "app/**"
      - "finops_dashboard/**"
      - ".github/workflows/finops-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finops-lint:
    name: FinOps Static AST & Prompt Cache Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FinOps AST Linter on Agent Runtime
        run: |
          python -m finops_dashboard.cli_lint app --format json --fail-on-findings
